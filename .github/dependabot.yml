version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # A GroupDocs.Search bump changes the thing being profiled. Sessions recorded before and after
    # are not comparable without a re-run, so these need a profiling pass, not just a green build.
    labels:
      - dependencies
      - needs-profiling-rerun

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
